services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: ${DATABASE_USERNAME:-restaurant}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-restaurant}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - restaurant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-restaurant}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-restaurant}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "gosu", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  restaurant_data:
  rabbitmq_data:
